<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>Career Test | Svastrino</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-variant": "#e5e2dd",
            "primary-fixed": "#dce1ff",
            "error": "#ba1a1a",
            "surface-bright": "#fcf9f4",
            "surface-dim": "#dcdad5",
            "surface-tint": "#4359aa",
            "background": "#fcf9f4",
            "primary-container": "#002173",
            "surface-container-low": "#f6f3ee",
            "on-surface-variant": "#444651",
            "on-primary-container": "#778de1",
            "surface-container-highest": "#e5e2dd",
            "surface": "#fcf9f4",
            "surface-container-high": "#ebe8e3",
            "primary": "#001044",
            "surface-container": "#f0ede8",
            "outline": "#757682",
            "on-background": "#1c1c19",
            "outline-variant": "#c5c5d3",
            "on-primary": "#ffffff",
            "secondary": "#555d7e",
            "surface-container-lowest": "#ffffff",
            "on-surface": "#1c1c19",
            "on-error": "#ffffff",
            "secondary-container": "#d1d8ff",
            "on-secondary-container": "#565e7f",
            "error-container": "#ffdad6"
          },
          fontFamily: { "headline": ["Inter"], "body": ["Inter"], "label": ["Inter"] },
          borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
        },
      },
    }
  </script>
  <style>
    .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }
    body { font-family: 'Inter', sans-serif; background-color: #fcf9f4; }

    /* Question transitions */
    .question-card {
      opacity: 0;
      transform: translateX(40px);
      transition: all 0.45s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
      position: absolute;
      width: 100%;
    }
    .question-card.active {
      opacity: 1;
      transform: translateX(0);
      pointer-events: auto;
      position: relative;
    }
    .question-card.exit-left {
      opacity: 0;
      transform: translateX(-40px);
    }

    /* Option selection */
    .option-btn {
      transition: all 0.2s ease;
      cursor: pointer;
    }
    .option-btn:hover {
      border-color: #001044;
      background: #f6f3ee;
      transform: translateY(-1px);
    }
    .option-btn.selected {
      border-color: #001044;
      background: #dce1ff;
      box-shadow: 0 0 0 2px #001044;
    }
    .option-btn.selected .option-letter {
      background: #001044;
      color: #fff;
    }

    /* Progress bar */
    .progress-fill {
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Modal */
    .modal-overlay {
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }
    .modal-overlay.show {
      opacity: 1;
      visibility: visible;
    }
    .modal-content {
      transform: scale(0.95) translateY(10px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .modal-overlay.show .modal-content {
      transform: scale(1) translateY(0);
    }

    /* OTP inputs */
    .otp-input {
      width: 52px;
      height: 60px;
      text-align: center;
      font-size: 1.5rem;
      font-weight: 700;
      border: 2px solid #c5c5d3;
      border-radius: 12px;
      background: #f6f3ee;
      color: #001044;
      outline: none;
      transition: all 0.2s ease;
    }
    .otp-input:focus {
      border-color: #001044;
      box-shadow: 0 0 0 3px rgba(0, 16, 68, 0.15);
      background: #fff;
    }
    .otp-input.filled {
      border-color: #001044;
      background: #dce1ff;
    }

    /* Confetti keyframes */
    @keyframes confettiFall {
      0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .confetti-piece {
      position: fixed;
      top: 0;
      width: 10px;
      height: 10px;
      z-index: 200;
      animation: confettiFall 3s ease-out forwards;
    }

    /* Pulse */
    @keyframes softPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.03); }
    }
  </style>
</head>
<body class="text-on-surface selection:bg-primary-fixed min-h-screen">

  <!-- Header -->
  <header class="sticky top-0 z-40 bg-background/90 backdrop-blur-xl border-b border-outline-variant/10">
    <div class="flex justify-between items-center w-full px-6 md:px-8 py-4 max-w-[900px] mx-auto">
      <a href="free-test.html" class="text-lg font-black text-primary tracking-tight hover:opacity-80 transition-opacity">Svastrino</a>
      <div class="flex items-center gap-3 text-sm text-on-surface-variant">
        <span class="material-symbols-outlined text-base">timer</span>
        <span id="timerDisplay">0:00</span>
      </div>
    </div>
  </header>

  <!-- Progress Bar -->
  <div class="sticky top-[57px] z-30 bg-background">
    <div class="max-w-[900px] mx-auto px-6 md:px-8 py-3">
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-on-surface-variant uppercase tracking-widest">Question <span id="currentQ">1</span> of 8</span>
        <span class="text-xs font-bold text-primary" id="progressPercent">0%</span>
      </div>
      <div class="h-1.5 bg-surface-container-high rounded-full overflow-hidden">
        <div class="h-full bg-gradient-to-r from-primary to-primary-container rounded-full progress-fill" id="progressBar" style="width: 0%"></div>
      </div>
    </div>
  </div>

  <!-- Test Container -->
  <main class="max-w-[700px] mx-auto px-6 pt-8 pb-24 relative" id="testContainer">
    <!-- Questions will be rendered by JS -->
  </main>

  <!-- Navigation Buttons -->
  <div class="fixed bottom-0 left-0 right-0 bg-background/90 backdrop-blur-xl border-t border-outline-variant/10 z-30" id="navButtons">
    <div class="max-w-[700px] mx-auto px-6 py-4 flex justify-between items-center">
      <button class="flex items-center gap-2 px-6 py-3 rounded-full text-sm font-semibold text-on-surface-variant hover:bg-surface-container-high transition-all disabled:opacity-30 disabled:cursor-not-allowed" id="prevBtn" disabled onclick="prevQuestion()">
        <span class="material-symbols-outlined text-sm">arrow_back</span>
        Previous
      </button>
      <button class="flex items-center gap-2 px-8 py-3 rounded-full text-sm font-bold bg-primary text-on-primary hover:bg-primary-container transition-all disabled:opacity-30 disabled:cursor-not-allowed shadow-lg shadow-primary/10" id="nextBtn" disabled onclick="nextQuestion()">
        Next
        <span class="material-symbols-outlined text-sm">arrow_forward</span>
      </button>
    </div>
  </div>

  <!-- Mobile Number Modal -->
  <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/40" id="mobileModal">
    <div class="modal-content bg-surface-container-lowest rounded-2xl p-8 md:p-10 max-w-md w-full shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="material-symbols-outlined text-primary text-3xl">celebration</span>
        </div>
        <h2 class="text-2xl font-extrabold text-primary mb-2">Test Complete! 🎉</h2>
        <p class="text-on-surface-variant text-sm">Enter your mobile number to receive your detailed career report with personalized insights.</p>
      </div>

      <div class="space-y-4">
        <label class="block text-xs font-bold text-on-surface-variant uppercase tracking-widest">Mobile Number</label>
        <div class="flex gap-3">
          <div class="flex items-center px-4 py-3 bg-surface-container-low rounded-xl text-sm font-semibold text-primary border border-outline-variant/20">
            +91
          </div>
          <input type="tel" id="mobileInput" maxlength="10" placeholder="Enter 10-digit number" class="flex-1 px-4 py-3 bg-surface-container-low border border-outline-variant/20 rounded-xl text-on-surface font-semibold focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all text-base" />
        </div>
        <p class="text-xs text-on-surface-variant/60" id="mobileError"></p>
      </div>

      <button class="w-full mt-6 bg-gradient-to-r from-primary to-primary-container text-on-primary py-4 rounded-xl font-bold text-base hover:scale-[0.98] active:scale-95 transition-transform shadow-lg shadow-primary/15 disabled:opacity-40" id="sendOtpBtn" disabled onclick="sendOtp()">
        Send OTP
      </button>

      <p class="text-center text-xs text-on-surface-variant/50 mt-4">We'll send a one-time password to verify your number</p>
    </div>
  </div>

  <!-- OTP Modal -->
  <div class="modal-overlay fixed inset-0 z-50 flex items-center justify-center p-6 bg-black/40" id="otpModal">
    <div class="modal-content bg-surface-container-lowest rounded-2xl p-8 md:p-10 max-w-md w-full shadow-2xl">
      <div class="text-center mb-8">
        <div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center mx-auto mb-4">
          <span class="material-symbols-outlined text-primary text-3xl">sms</span>
        </div>
        <h2 class="text-2xl font-extrabold text-primary mb-2">Verify OTP</h2>
        <p class="text-on-surface-variant text-sm">Enter the 4-digit code sent to <span class="font-semibold text-primary" id="otpMobileDisplay">+91 ••••••••••</span></p>
      </div>

      <div class="flex justify-center gap-3 mb-2" id="otpContainer">
        <input type="text" maxlength="1" class="otp-input" data-index="0" inputmode="numeric" pattern="[0-9]" />
        <input type="text" maxlength="1" class="otp-input" data-index="1" inputmode="numeric" pattern="[0-9]" />
        <input type="text" maxlength="1" class="otp-input" data-index="2" inputmode="numeric" pattern="[0-9]" />
        <input type="text" maxlength="1" class="otp-input" data-index="3" inputmode="numeric" pattern="[0-9]" />
      </div>
      <p class="text-xs text-center text-on-surface-variant/60 mb-6" id="otpError"></p>

      <button class="w-full bg-gradient-to-r from-primary to-primary-container text-on-primary py-4 rounded-xl font-bold text-base hover:scale-[0.98] active:scale-95 transition-transform shadow-lg shadow-primary/15 disabled:opacity-40" id="verifyOtpBtn" disabled onclick="verifyOtp()">
        Verify & Get Results
      </button>

      <div class="text-center mt-5">
        <button class="text-sm font-semibold text-primary hover:underline disabled:opacity-40 disabled:no-underline" id="resendBtn" disabled onclick="resendOtp()">
          Resend OTP <span id="resendTimer">(30s)</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    // ─── QUESTIONS DATA ───
    const questions = [
      {
        id: 1,
        category: "Personality",
        question: "When faced with a complex problem, what is your first instinct?",
        options: [
          { letter: "A", text: "Break it down into smaller, logical steps" },
          { letter: "B", text: "Brainstorm creative and unconventional solutions" },
          { letter: "C", text: "Discuss it with others to get diverse perspectives" },
          { letter: "D", text: "Research thoroughly before making a move" }
        ]
      },
      {
        id: 2,
        category: "Work Style",
        question: "Which work environment makes you feel most productive?",
        options: [
          { letter: "A", text: "A quiet, structured office with clear routines" },
          { letter: "B", text: "A vibrant, open space with lots of energy" },
          { letter: "C", text: "Remote work with flexible hours" },
          { letter: "D", text: "A lab or workshop where I can experiment" }
        ]
      },
      {
        id: 3,
        category: "Values",
        question: "What matters most to you in a career?",
        options: [
          { letter: "A", text: "Financial stability and growth potential" },
          { letter: "B", text: "Creative freedom and self-expression" },
          { letter: "C", text: "Making a positive impact on society" },
          { letter: "D", text: "Continuous learning and intellectual challenge" }
        ]
      },
      {
        id: 4,
        category: "Strengths",
        question: "Which skill comes most naturally to you?",
        options: [
          { letter: "A", text: "Analyzing data and spotting patterns" },
          { letter: "B", text: "Persuading and inspiring others" },
          { letter: "C", text: "Organizing projects and managing timelines" },
          { letter: "D", text: "Designing and visualizing concepts" }
        ]
      },
      {
        id: 5,
        category: "Leadership",
        question: "In a team project, you naturally tend to...",
        options: [
          { letter: "A", text: "Take charge and delegate responsibilities" },
          { letter: "B", text: "Contribute ideas and support the leader" },
          { letter: "C", text: "Mediate conflicts and keep morale high" },
          { letter: "D", text: "Focus on the technical execution" }
        ]
      },
      {
        id: 6,
        category: "Interests",
        question: "Which of these activities excites you the most?",
        options: [
          { letter: "A", text: "Building something from scratch — an app, a business, a prototype" },
          { letter: "B", text: "Writing, storytelling, or creating content" },
          { letter: "C", text: "Helping people solve personal or health problems" },
          { letter: "D", text: "Crunching numbers and finding hidden insights in data" }
        ]
      },
      {
        id: 7,
        category: "Decision Making",
        question: "When making important decisions, you rely most on...",
        options: [
          { letter: "A", text: "Logic, facts, and evidence" },
          { letter: "B", text: "Gut feeling and intuition" },
          { letter: "C", text: "Advice from people I trust" },
          { letter: "D", text: "Weighing all possible outcomes carefully" }
        ]
      },
      {
        id: 8,
        category: "Future Vision",
        question: "In 10 years, where do you see yourself?",
        options: [
          { letter: "A", text: "Leading a company or managing a large team" },
          { letter: "B", text: "Working independently on passion projects" },
          { letter: "C", text: "Being a recognized expert in my field" },
          { letter: "D", text: "Traveling and working across different cultures" }
        ]
      }
    ];

    // ─── STATE ───
    let currentQuestion = 0;
    let answers = {};
    let timerSeconds = 0;
    let timerInterval = null;
    let resendInterval = null;
    let mobileNumber = '';

    // ─── RENDER QUESTIONS ───
    function renderQuestions() {
      const container = document.getElementById('testContainer');
      container.innerHTML = questions.map((q, i) => `
        <div class="question-card ${i === 0 ? 'active' : ''}" data-q="${i}">
          <div class="mb-8">
            <span class="inline-block px-4 py-1.5 rounded-full bg-primary-fixed text-primary text-xs font-bold uppercase tracking-widest mb-4">${q.category}</span>
            <h2 class="text-2xl md:text-3xl font-extrabold text-primary leading-tight tracking-tight">${q.question}</h2>
          </div>
          <div class="space-y-3">
            ${q.options.map(opt => `
              <button class="option-btn w-full flex items-center gap-4 p-5 rounded-xl border-2 border-outline-variant/20 bg-surface-container-lowest text-left group" onclick="selectOption(${i}, '${opt.letter}', this)">
                <span class="option-letter flex-shrink-0 w-10 h-10 rounded-full border-2 border-outline-variant/30 flex items-center justify-center font-bold text-sm text-on-surface-variant group-hover:border-primary transition-colors">${opt.letter}</span>
                <span class="text-base font-medium text-on-surface">${opt.text}</span>
              </button>
            `).join('')}
          </div>
        </div>
      `).join('');
    }

    // ─── SELECT OPTION ───
    function selectOption(qIndex, letter, btn) {
      answers[qIndex] = letter;
      // Clear previous selection in this question
      const card = btn.closest('.question-card');
      card.querySelectorAll('.option-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
      // Enable next button
      document.getElementById('nextBtn').disabled = false;
      // Auto-advance after brief delay (except last question)
      if (qIndex < questions.length - 1) {
        setTimeout(() => nextQuestion(), 500);
      } else {
        // Last question: change next button to "Finish"
        const nextBtn = document.getElementById('nextBtn');
        nextBtn.innerHTML = 'Finish <span class="material-symbols-outlined text-sm">check</span>';
      }
    }

    // ─── NAVIGATION ───
    function nextQuestion() {
      if (answers[currentQuestion] === undefined) return;

      if (currentQuestion === questions.length - 1) {
        finishTest();
        return;
      }

      const cards = document.querySelectorAll('.question-card');
      cards[currentQuestion].classList.remove('active');
      cards[currentQuestion].classList.add('exit-left');
      currentQuestion++;
      cards[currentQuestion].classList.add('active');

      updateUI();
    }

    function prevQuestion() {
      if (currentQuestion === 0) return;

      const cards = document.querySelectorAll('.question-card');
      cards[currentQuestion].classList.remove('active');
      currentQuestion--;
      cards[currentQuestion].classList.remove('exit-left');
      cards[currentQuestion].classList.add('active');

      updateUI();
    }

    function updateUI() {
      const pct = Math.round((currentQuestion / questions.length) * 100);
      document.getElementById('progressBar').style.width = pct + '%';
      document.getElementById('progressPercent').textContent = pct + '%';
      document.getElementById('currentQ').textContent = currentQuestion + 1;
      document.getElementById('prevBtn').disabled = currentQuestion === 0;
      document.getElementById('nextBtn').disabled = answers[currentQuestion] === undefined;

      // Update next button text
      const nextBtn = document.getElementById('nextBtn');
      if (currentQuestion === questions.length - 1) {
        nextBtn.innerHTML = answers[currentQuestion] !== undefined
          ? 'Finish <span class="material-symbols-outlined text-sm">check</span>'
          : 'Next <span class="material-symbols-outlined text-sm">arrow_forward</span>';
      } else {
        nextBtn.innerHTML = 'Next <span class="material-symbols-outlined text-sm">arrow_forward</span>';
      }
    }

    // ─── FINISH TEST ───
    function finishTest() {
      clearInterval(timerInterval);
      // Set progress to 100%
      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressPercent').textContent = '100%';
      // Hide nav buttons
      document.getElementById('navButtons').style.display = 'none';
      // Show confetti
      createConfetti();
      // Show mobile modal after brief delay
      setTimeout(() => {
        document.getElementById('mobileModal').classList.add('show');
      }, 800);
    }

    // ─── CONFETTI ───
    function createConfetti() {
      const colors = ['#001044', '#002173', '#778de1', '#dce1ff', '#ffb950', '#ffddb3'];
      for (let i = 0; i < 50; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random() * 100 + 'vw';
        piece.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDelay = Math.random() * 1.5 + 's';
        piece.style.animationDuration = (2 + Math.random() * 2) + 's';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.width = (6 + Math.random() * 8) + 'px';
        piece.style.height = (6 + Math.random() * 8) + 'px';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 4000);
      }
    }

    // ─── MOBILE NUMBER ───
    const mobileInput = document.getElementById('mobileInput');
    const sendOtpBtn = document.getElementById('sendOtpBtn');

    mobileInput.addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
      sendOtpBtn.disabled = e.target.value.length !== 10;
      document.getElementById('mobileError').textContent = '';
    });

    function sendOtp() {
      mobileNumber = mobileInput.value;
      if (mobileNumber.length !== 10) {
        document.getElementById('mobileError').textContent = 'Please enter a valid 10-digit mobile number';
        return;
      }

      sendOtpBtn.textContent = 'Sending...';
      sendOtpBtn.disabled = true;

      // Simulate OTP send
      setTimeout(() => {
        document.getElementById('mobileModal').classList.remove('show');
        sendOtpBtn.textContent = 'Send OTP';

        // Show OTP modal
        setTimeout(() => {
          document.getElementById('otpMobileDisplay').textContent = '+91 ' + mobileNumber.slice(0, 2) + '••••' + mobileNumber.slice(-4);
          document.getElementById('otpModal').classList.add('show');
          document.querySelectorAll('.otp-input')[0].focus();
          startResendTimer();
        }, 300);
      }, 1200);
    }

    // ─── OTP HANDLING ───
    const otpInputs = document.querySelectorAll('.otp-input');
    const verifyOtpBtn = document.getElementById('verifyOtpBtn');

    otpInputs.forEach((input, idx) => {
      input.addEventListener('input', (e) => {
        e.target.value = e.target.value.replace(/\D/g, '').slice(0, 1);
        if (e.target.value && idx < otpInputs.length - 1) {
          otpInputs[idx + 1].focus();
        }
        if (e.target.value) input.classList.add('filled');
        else input.classList.remove('filled');
        checkOtpFilled();
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && idx > 0) {
          otpInputs[idx - 1].focus();
          otpInputs[idx - 1].value = '';
          otpInputs[idx - 1].classList.remove('filled');
          checkOtpFilled();
        }
      });

      // Handle paste
      input.addEventListener('paste', (e) => {
        e.preventDefault();
        const pasted = e.clipboardData.getData('text').replace(/\D/g, '').slice(0, 4);
        pasted.split('').forEach((char, i) => {
          if (otpInputs[i]) {
            otpInputs[i].value = char;
            otpInputs[i].classList.add('filled');
          }
        });
        if (pasted.length > 0) otpInputs[Math.min(pasted.length, 3)].focus();
        checkOtpFilled();
      });
    });

    function checkOtpFilled() {
      const filled = Array.from(otpInputs).every(i => i.value.length === 1);
      verifyOtpBtn.disabled = !filled;
    }

    function verifyOtp() {
      const otp = Array.from(otpInputs).map(i => i.value).join('');
      document.getElementById('otpError').textContent = '';
      verifyOtpBtn.textContent = 'Verifying...';
      verifyOtpBtn.disabled = true;

      // Simulate verification
      setTimeout(() => {
        // Accept any 4-digit OTP for demo
        document.getElementById('otpModal').classList.remove('show');
        // Redirect to portal hub with success flag
        window.location.href = 'psychometric-test.html?completed=true';
      }, 1500);
    }

    function startResendTimer() {
      let seconds = 30;
      const resendBtn = document.getElementById('resendBtn');
      const resendTimer = document.getElementById('resendTimer');
      resendBtn.disabled = true;

      if (resendInterval) clearInterval(resendInterval);
      resendInterval = setInterval(() => {
        seconds--;
        resendTimer.textContent = `(${seconds}s)`;
        if (seconds <= 0) {
          clearInterval(resendInterval);
          resendBtn.disabled = false;
          resendTimer.textContent = '';
        }
      }, 1000);
    }

    function resendOtp() {
      document.getElementById('otpError').textContent = 'New OTP sent!';
      document.getElementById('otpError').style.color = '#16a34a';
      startResendTimer();
      setTimeout(() => {
        document.getElementById('otpError').textContent = '';
      }, 3000);
    }

    // ─── TIMER ───
    function startTimer() {
      timerInterval = setInterval(() => {
        timerSeconds++;
        const m = Math.floor(timerSeconds / 60);
        const s = timerSeconds % 60;
        document.getElementById('timerDisplay').textContent = `${m}:${s.toString().padStart(2, '0')}`;
      }, 1000);
    }

    // ─── INIT ───
    document.addEventListener('DOMContentLoaded', () => {
      renderQuestions();
      startTimer();
    });
  </script>
</body>
</html>
